plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mdmuntakim.linux41'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mdmuntakim.linux41'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file('../keystore/linux41.jks')
            storePassword 'linux41'
            keyAlias 'linux41'
            keyPassword 'linux41'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    androidResources {
        // keep the default compression; the guest images are mostly zeros
    }
}

// Fail the build when the arm64 QEMU binary or the guest assets are missing.
tasks.register('checkAssets') {
    doLast {
        def required = [
                'src/main/assets/kernel/bzImage',
                'src/main/assets/rootfs/rootfs.img',
                'src/main/assets/qemu/pc-bios/bios.bin',
                'src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so',
        ]
        required.each { p ->
            if (!file(p).isFile()) throw new GradleException("missing build input: ${p}")
        }
    }
}
preBuild.dependsOn 'checkAssets'
